name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot: ["4.23.1", "4.29.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt "astrbot==${{ matrix.astrbot }}"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build plugin ZIP
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-astrbot-${{ matrix.astrbot }}
          path: dist/*.zip
